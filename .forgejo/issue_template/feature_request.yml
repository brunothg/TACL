name: Feature request
about: Suggest a new feature, UI improvement, or enhancement for the app
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: textarea
    id: summary
    attributes:
      label: Feature summary
      description: A clear and concise description of the feature you would like to see.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem does this solve, or how would it improve your workflow?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you envision this working.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Are there any workarounds or similar features already existing in the app?
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre submission checklist
      options:
        - label: I have searched existing issues to make sure this feature has not already been requested.
          required: true